[platformio]
default_envs = fefo35
core_dir = .platformio

[env:fefo35]
platform = espressif32 @ 7.0.1
board = esp32dev
framework = arduino
board_build.partitions = partitions_fefo_ota.csv
monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder, time
lib_deps =
    bodmer/TFT_eSPI @ 2.5.43
    adafruit/Adafruit NeoPixel @ 1.15.2
build_unflags =
    -std=gnu++11
build_flags =
    -std=gnu++17
    -D CORE_DEBUG_LEVEL=1
    -D USER_SETUP_LOADED=1
    -D ILI9488_DRIVER=1
    -D TFT_MISO=12
    -D TFT_MOSI=13
    -D TFT_SCLK=14
    -D TFT_CS=15
    -D TFT_DC=2
    -D TFT_RST=-1
    -D TFT_BL=27
    -D TFT_BACKLIGHT_ON=HIGH
    -D TFT_RGB_ORDER=TFT_BGR
    -D TFT_INVERSION_OFF=1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SPI_FREQUENCY=55000000
    -D SPI_READ_FREQUENCY=20000000
    -D SPI_TOUCH_FREQUENCY=2500000
