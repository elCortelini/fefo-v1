      <text x="110" y="68" text-anchor="middle" font-size="11" fill="#cbd5e1">Faces RAW RGB565</text>
    </g>

    <line x1="1240" y1="77" x2="1280" y2="77" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(1280, 35)">
      <rect width="170" height="85" rx="10" fill="#1e1b4b" stroke="#818cf8" stroke-width="1.5"/>
      <text x="85" y="32" text-anchor="middle" font-size="12" font-weight="bold" fill="#a5b4fc">Catálogo Online</text>
      <text x="85" y="52" text-anchor="middle" font-size="11" fill="#cbd5e1">catalog.json assinado</text>
      <text x="85" y="68" text-anchor="middle" font-size="11" fill="#cbd5e1">Disponível OTA</text>
