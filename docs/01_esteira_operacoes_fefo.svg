      <text x="130" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#facc15">Separação &amp; Despacho</text>
      <text x="130" y="52" text-anchor="middle" font-size="11" fill="#cbd5e1">Baixa no Estoque Físico</text>
      <text x="130" y="68" text-anchor="middle" font-size="11" fill="#cbd5e1">Correios / Transportadora</text>
