      <text x="130" y="52" text-anchor="middle" font-size="11" fill="#cbd5e1">Apresentação / Demonstração</text>
      <text x="130" y="68" text-anchor="middle" font-size="11" fill="#cbd5e1">Negociação B2C, B2B ou B2G</text>
