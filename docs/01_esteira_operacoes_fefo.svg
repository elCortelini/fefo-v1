      <text x="130" y="52" text-anchor="middle" font-size="11" fill="#cbd5e1">Contratos (5 tipos de cessão)</text>
      <text x="130" y="68" text-anchor="middle" font-size="11" fill="#cbd5e1">Emissão NF-e (Contabilidade)</text>
    </g>

    <line x1="610" y1="77" x2="660" y2="77" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(660, 35)">
