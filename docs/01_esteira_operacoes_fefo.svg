      <text x="105" y="52" text-anchor="middle" font-size="11" fill="#cbd5e1">Demandas do TEA</text>
      <text x="105" y="68" text-anchor="middle" font-size="11" fill="#cbd5e1">Adaptação Clínica / Home</text>
    </g>

    <line x1="240" y1="77" x2="280" y2="77" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

    <g transform="translate(280, 35)">
      <rect width="210" height="85" rx="10" fill="#334155" stroke="#f87171" stroke-width="1.5"/>
      <text x="105" y="32" text-anchor="middle" font-size="13" font-weight="bold" fill="#f87171">Roteirização</text>
      <text x="105" y="52" text-anchor="middle" font-size="11" fill="#cbd5e1">Histórias, Músicas, Aulas</text>
      <text x="105" y="68" text-anchor="middle" font-size="11" fill="#cbd5e1">Cards RFID &amp; Manuais</text>
    </g>

    <line x1="490" y1="77" x2="530" y2="77" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>

