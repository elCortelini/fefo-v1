    <g transform="translate(530, 35)">
      <polygon points="100,5 190,42 100,80 10,42" fill="#450a0a" stroke="#ef4444" stroke-width="2"/>
      <text x="100" y="40" text-anchor="middle" font-size="11" font-weight="bold" fill="#fca5a5">Validação</text>
      <text x="100" y="54" text-anchor="middle" font-size="10" fill="#fca5a5">Clínica?</text>
    </g>

    <line x1="720" y1="77" x2="760" y2="77" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)"/>

