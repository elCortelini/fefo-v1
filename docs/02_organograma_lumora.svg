<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 950" width="100%" height="100%" style="background:#0b1120; font-family:'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="gradTitle2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- CABEÇALHO -->
  <text x="750" y="50" text-anchor="middle" font-size="28" font-weight="bold" fill="url(#gradTitle2)">ORGANOGRAMA ESTRUTURAL &amp; RESPONSABILIDADES — LUMORA</text>
  <text x="750" y="80" text-anchor="middle" font-size="15" fill="#94a3b8">Estrutura organizacional da equipe para o Projeto FEFO</text>

  <!-- NÍVEL 1: DIREÇÃO EXECUTIVA -->
  <g transform="translate(500, 110)">
    <rect width="500" height="90" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="2.5" filter="url(#boxShadow)"/>
    <text x="250" y="32" text-anchor="middle" font-size="16" font-weight="bold" fill="#38bdf8">DIREÇÃO EXECUTIVA &amp; CO-FUNDAÇÃO</text>
    <text x="250" y="56" text-anchor="middle" font-size="14" font-weight="bold" fill="#ffffff">Elevi &amp; Tailise</text>
    <text x="250" y="75" text-anchor="middle" font-size="11" fill="#94a3b8">Estratégia Geral • Governança • Relações com Centelha e Parcerias</text>
  </g>

  <!-- LINHA TRONCO PRINCIPAL -->
  <line x1="750" y1="200" x2="750" y2="280" stroke="#475569" stroke-width="3"/>
  <line x1="190" y1="280" x2="1310" y2="280" stroke="#475569" stroke-width="3"/>

  <!-- RAMIFICAÇÕES VERTICAIS -->
  <line x1="190" y1="280" x2="190" y2="330" stroke="#475569" stroke-width="3"/>
  <line x1="560" y1="280" x2="560" y2="330" stroke="#475569" stroke-width="3"/>
  <line x1="940" y1="280" x2="940" y2="330" stroke="#475569" stroke-width="3"/>
  <line x1="1310" y1="280" x2="1310" y2="330" stroke="#475569" stroke-width="3"/>

  <!-- COLUNA 1: PEDAGÓGICO -->
  <g transform="translate(50, 330)">
    <rect width="280" height="480" rx="14" fill="#1e293b" stroke="#ef4444" stroke-width="2" filter="url(#boxShadow)"/>
    <rect width="280" height="50" rx="14" fill="#ef4444"/>
    <text x="140" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">P&amp;D PEDAGÓGICO</text>

    <text x="140" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#fca5a5">LÍDER: Tailise</text>
    <text x="140" y="98" text-anchor="middle" font-size="11" fill="#cbd5e1">Especialista Pedagógica / TEA</text>
    <line x1="20" y1="115" x2="260" y2="115" stroke="#334155" stroke-width="1.5"/>

    <text x="20" y="145" font-size="13" font-weight="bold" fill="#f87171">Responsabilidades:</text>
    <text x="20" y="175" font-size="12" fill="#cbd5e1">• Metodologia inclusiva TEA</text>
    <text x="20" y="200" font-size="12" fill="#cbd5e1">• Roteiros de histórias e áudios</text>
    <text x="20" y="225" font-size="12" fill="#cbd5e1">• Criação de atividades e cards</text>
    <text x="20" y="250" font-size="12" fill="#cbd5e1">• Elaboração do manual didático</text>
    <text x="20" y="275" font-size="12" fill="#cbd5e1">• Validação de estímulos sensoriais</text>
    <text x="20" y="300" font-size="12" fill="#cbd5e1">• Adaptação clínica vs residencial</text>
    <text x="20" y="325" font-size="12" fill="#cbd5e1">• Suporte pedagógico aos pais</text>

    <rect x="20" y="390" width="240" height="65" rx="8" fill="#450a0a" stroke="#ef4444" stroke-width="1"/>
    <text x="140" y="415" text-anchor="middle" font-size="11" font-weight="bold" fill="#fca5a5">Status da Posição:</text>
    <text x="140" y="435" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">DEFINIDA (Tailise)</text>
  </g>

  <!-- COLUNA 2: DESENVOLVIMENTO & ENGENHARIA -->
  <g transform="translate(420, 330)">
    <rect width="280" height="480" rx="14" fill="#1e293b" stroke="#0284c7" stroke-width="2" filter="url(#boxShadow)"/>
    <rect width="280" height="50" rx="14" fill="#0284c7"/>
    <text x="140" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#ffffff">TECNOLOGIA &amp; PROD.</text>

    <text x="140" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#7dd3fc">LÍDER: Elevi</text>
    <text x="140" y="98" text-anchor="middle" font-size="11" fill="#cbd5e1">Engenharia, Software &amp; Maker</text>
    <line x1="20" y1="115" x2="260" y2="115" stroke="#334155" stroke-width="1.5"/>

    <text x="20" y="145" font-size="13" font-weight="bold" fill="#38bdf8">Responsabilidades:</text>
    <text x="20" y="175" font-size="12" fill="#cbd5e1">• Firmware CYD ESP32 (C++)</text>
    <text x="20" y="200" font-size="12" fill="#cbd5e1">• Aplicativo Flutter (Android/iOS)</text>
    <text x="20" y="225" font-size="12" fill="#cbd5e1">• Protocolo BLE e OTA Wi-Fi</text>
    <text x="20" y="250" font-size="12" fill="#cbd5e1">• Catálogo online (catalog.json)</text>
    <text x="20" y="275" font-size="12" fill="#cbd5e1">• Impressão 3D e montagem</text>
    <text x="20" y="300" font-size="12" fill="#cbd5e1">• Testes de bancada e QA final</text>
    <text x="20" y="325" font-size="12" fill="#cbd5e1">• Assistência técnica (RMA)</text>

    <rect x="20" y="390" width="240" height="65" rx="8" fill="#082f49" stroke="#0284c7" stroke-width="1"/>
    <text x="140" y="415" text-anchor="middle" font-size="11" font-weight="bold" fill="#7dd3fc">Status da Posição:</text>
    <text x="140" y="435" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">DEFINIDA (Elevi)</text>
  </g>

  <!-- COLUNA 3: MÍDIAS & COMUNICAÇÃO -->
  <g transform="translate(800, 330)">
    <rect width="280" height="480" rx="14" fill="#1e293b" stroke="#a855f7" stroke-width="2" filter="url(#boxShadow)"/>
    <rect width="280" height="50" rx="14" fill="#a855f7"/>
