    <text x="140" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#d8b4fe">EQUIPE A MONTAR</text>
    <text x="140" y="98" text-anchor="middle" font-size="11" fill="#cbd5e1">2 Subdivisões complementares</text>
    <line x1="20" y1="115" x2="260" y2="115" stroke="#334155" stroke-width="1.5"/>

    <text x="20" y="140" font-size="12" font-weight="bold" fill="#c084fc">Subdivisão 1: Criação (Assets)</text>
    <text x="20" y="165" font-size="12" fill="#cbd5e1">• Locução (a "Voz do FEFO")</text>
    <text x="20" y="185" font-size="12" fill="#cbd5e1">• Edição de som, efeitos e trilhas</text>
    <text x="20" y="205" font-size="12" fill="#cbd5e1">• Ilustração de faces (carinhas)</text>
    <text x="20" y="225" font-size="12" fill="#cbd5e1">• Diagramação de cards e manuais</text>

    <text x="20" y="260" font-size="12" font-weight="bold" fill="#c084fc">Subdivisão 2: Redes &amp; Tráfego</text>
    <text x="20" y="285" font-size="12" fill="#cbd5e1">• Gestão do Instagram e YouTube</text>
    <text x="20" y="305" font-size="12" fill="#cbd5e1">• Vídeos rápidos com o pet em uso</text>
    <text x="20" y="325" font-size="12" fill="#cbd5e1">• Autoridade em Inclusão TEA</text>
    <text x="20" y="345" font-size="12" fill="#cbd5e1">• Anúncios para famílias e clínicas</text>

    <rect x="20" y="390" width="240" height="65" rx="8" fill="#3b0764" stroke="#a855f7" stroke-width="1"/>
    <text x="140" y="415" text-anchor="middle" font-size="11" font-weight="bold" fill="#d8b4fe">Recomendação:</text>
    <text x="140" y="435" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Freelancers PJ / Estagiários</text>
  </g>

  <!-- COLUNA 4: VENDAS & COMERCIAL -->
  <g transform="translate(1170, 330)">
    <rect width="280" height="480" rx="14" fill="#1e293b" stroke="#eab308" stroke-width="2" filter="url(#boxShadow)"/>
    <rect width="280" height="50" rx="14" fill="#eab308"/>
    <text x="140" y="32" text-anchor="middle" font-size="15" font-weight="bold" fill="#000000">VENDAS &amp; ATENDIMENTO</text>

    <text x="140" y="80" text-anchor="middle" font-size="13" font-weight="bold" fill="#fde047">EQUIPE A MONTAR</text>
    <text x="140" y="98" text-anchor="middle" font-size="11" fill="#cbd5e1">Comercial &amp; Relacionamento</text>
    <line x1="20" y1="115" x2="260" y2="115" stroke="#334155" stroke-width="1.5"/>

    <text x="20" y="145" font-size="13" font-weight="bold" fill="#facc15">Responsabilidades:</text>
    <text x="20" y="175" font-size="12" fill="#cbd5e1">• Prospecção ativa de clínicas TEA</text>
    <text x="20" y="200" font-size="12" fill="#cbd5e1">• Relações públicas com escolas</text>
    <text x="20" y="225" font-size="12" fill="#cbd5e1">• Contato institucional c/ prefeituras</text>
    <text x="20" y="250" font-size="12" fill="#cbd5e1">• Atendimento a famílias (B2C)</text>
    <text x="20" y="275" font-size="12" fill="#cbd5e1">• Fechamento de contratos de cessão</text>
    <text x="20" y="300" font-size="12" fill="#cbd5e1">• Acompanhamento da entrega</text>
    <text x="20" y="325" font-size="12" fill="#cbd5e1">• Coleta de feedbacks e depoimentos</text>

    <rect x="20" y="390" width="240" height="65" rx="8" fill="#422006" stroke="#eab308" stroke-width="1"/>
    <text x="140" y="415" text-anchor="middle" font-size="11" font-weight="bold" fill="#fde047">Recomendação:</text>
    <text x="140" y="435" text-anchor="middle" font-size="12" font-weight="bold" fill="#ffffff">Comissionado / SDR PJ</text>
  </g>

  <!-- SERVIÇOS DE APOIO / TERCEIRIZADOS (LATERAL DIREITA OU INFERIOR) -->
  <g transform="translate(50, 830)">
    <rect width="1400" height="70" rx="10" fill="#1e293b" stroke="#64748b" stroke-dasharray="6,6" stroke-width="1.5"/>
    <text x="30" y="40" font-size="13" font-weight="bold" fill="#94a3b8">APOIO EXTERNO &amp; TERCEIRIZAÇÃO:</text>
    <rect x="300" y="18" width="320" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="460" y="41" text-anchor="middle" font-size="12" fill="#38bdf8">Contabilidade Externa (Fiscal / NF / Centelha)</text>

    <rect x="660" y="18" width="320" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="820" y="41" text-anchor="middle" font-size="12" fill="#cbd5e1">Assessoria Jurídica (Contratos de Cessão / LGPD)</text>

    <rect x="1020" y="18" width="340" height="36" rx="6" fill="#0f172a" stroke="#475569"/>
    <text x="1190" y="41" text-anchor="middle" font-size="12" fill="#cbd5e1">Gráfica Parceira (Impressão de Manuais e Caixas)</text>
  </g>
</svg>