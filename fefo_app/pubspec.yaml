name: fefoflutterv1
description: "Um novo projeto Flutter."
publish_to: 'none'
version: 1.100.0+1100

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  audioplayers: ^6.0.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  sticky_headers: ^0.3.0+2

  sqflite: ^2.3.3
  path: ^1.9.1
  path_provider: ^2.1.5
  intl: ^0.19.0
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  flutter_timezone: ^5.0.1

  time_picker_sheet: ^0.0.2+1

  flutter_blue_plus: ^2.3.11
  permission_handler: ^12.0.1
  file_picker: ^11.0.2
  crypto: ^3.0.6


dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/sounds/
    - assets/fonts/

  fonts:
    - family: Billotilde
      fonts:
        - asset: assets/fonts/billotilde.otf
    - family: KGPen
      fonts:
        - asset: assets/fonts/kgpen.otf

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/fefo.png"
  min_sdk_android: 21
