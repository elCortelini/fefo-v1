<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FEFO - Catálogo v4 | Gestor Pedagógico, Hardware & Bundles SD</title>
  <link rel="stylesheet" href="admin-v4.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
</head>
<body class="fefo-theme-v4">

  <!-- BARRA SUPERIOR DE CONTROLE E NAVEGAÇÃO -->
  <header class="v3-top-bar">
    <div class="top-bar-container">
      <div class="top-bar-left">
        <a href="../index.html" class="btn-back-site" title="Voltar ao Site Oficial">🌐 Site</a>
        <div class="brand-pill">
          <span class="brand-icon">🤖</span>
          <span class="brand-name">FEFO <span class="badge-v4">CATÁLOGO v4</span></span>
        </div>
      </div>

      <div class="top-bar-right">
        <!-- Badge de Sincronização em Nuvem (Multi-PC) -->
        <div id="github-sync-pill" class="gh-sync-pill" title="Clique para gerenciar a conexão com o GitHub">
          <span class="gh-cloud-icon">☁️</span>
          <span class="gh-repo-name">elCortelini/fefo-v1</span>
        </div>
        <button type="button" class="btn-action-sm btn-cloud-refresh" id="btn-sync-cloud" title="Recarregar dados frescos da nuvem em tempo real">
          🔄 Sincronizar Nuvem
        </button>
        <button type="button" class="btn-action-sm btn-bundle-sd" id="btn-gerar-bundle-sd" title="Exportar manifesto e estrutura de arquivos para SD Card (/usr/a, /usr/f, /usr/c)">
          📦 Gerar Bundle SD
        </button>
        <input type="file" id="input-import-json" accept=".json" style="display: none;">
        <button type="button" class="btn-action-sm" id="btn-import-catalog" title="Importar catalog-v4.json">📥 Importar</button>
        <button type="button" class="btn-action-sm" id="btn-export-catalog" title="Baixar catalog-v4.json">💾 Baixar JSON</button>
        <div class="version-badge" id="global-version-display" title="Versão Global do Catálogo">v4.001</div>
      </div>
    </div>
  </header>

  <!-- CONTAINER PRINCIPAL: GESTÃO POR EIXOS TEMÁTICOS & PACOTES (v4) -->
  <main class="v3-main-container">

    <!-- CABEÇALHO DO CATÁLOGO: TÍTULO & BOTÃO DE ADICIONAR PACOTE (OPÇÃO A) -->
    <div class="catalog-overview-header">
      <div class="overview-title-box">
        <h1 class="overview-title">🎨 Eixos Temáticos & Gestão de Pacotes</h1>
        <p class="overview-subtitle">8 Eixos Oficiais do Ecossistema FEFO com controle de pacotes, downloads e integração com firmware/app.</p>
      </div>
      <div class="overview-actions-box">
        <button type="button" class="btn-top-add-pacote" id="btn-top-add-pacote" title="Adicionar Novo Pacote / Historinha">
          ➕ Adicionar Novo Pacote
        </button>
      </div>
    </div>

    <!-- LISTA MASTER DE EIXOS TEMÁTICOS COM PACOTES SUBMISSOS -->
    <div id="eixos-master-container" class="eixos-master-list">
      <!-- Renderizado dinamicamente via JS -->
    </div>

  </main>

  <!-- RECEPTÁCULO INVISÍVEL PARA UPLOAD DE ARQUIVOS -->
  <input type="file" id="file-uploader-general" style="display: none;">

  <!-- TOAST DE NOTIFICAÇÃO NÃO INTRUSIVO -->
  <div class="v3-toast-container" id="v3-toast-container" aria-live="polite"></div>

  <!-- SCRIPTS -->
  <script src="github-sync.js"></script>
  <script src="admin-v4.js"></script>
</body>
</html>
